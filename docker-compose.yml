services:
  db:
    image: postgres:15-alpine
    container_name: tarefas-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tarefas}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
